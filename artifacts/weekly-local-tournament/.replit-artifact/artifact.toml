kind = "web"
previewPath = "/"
title = "Weekly Local Tournament"
description = "A mobile-first esports tournament marketplace where players discover, register for, and track competitive tournaments across BGMI, Free Fire, Ludo, and more."
version = "1.0.0"
id = "artifacts/weekly-local-tournament"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26006

[services.development]
run = "pnpm --filter @workspace/weekly-local-tournament run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/weekly-local-tournament", "run", "build" ]
serve = "static"
publicDir = "artifacts/weekly-local-tournament/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26006"
BASE_PATH = "/"
